name: Deploy to EC2

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env from Secrets
        run: |
          cat > .env << 'EOF'
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=${{ secrets.DB_NAME }}
          EOF

      - name: Copy source to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: ".env,requirements.txt,src,README.md,.gitignore"
          target: "${{ secrets.EC2_PATH }}"
          strip_components: 0
          overwrite: true
          rm: true

      - name: Install deps and restart app on EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.EC2_PATH }}
            chmod 600 .env || true
            export DEBIAN_FRONTEND=noninteractive
            if command -v apt-get >/dev/null 2>&1; then
              sudo apt-get update -y
              sudo apt-get install -y python3 python3-venv python3-pip || true
              sudo apt-get install -y python3.12-venv || true
            elif command -v yum >/dev/null 2>&1; then
              sudo yum install -y python3 python3-pip
            fi
            rm -rf "${{ secrets.EC2_PATH }}/.venv"
            python3 -m venv "${{ secrets.EC2_PATH }}/.venv"
            test -f "${{ secrets.EC2_PATH }}/.venv/bin/activate"
            source "${{ secrets.EC2_PATH }}/.venv/bin/activate"
            pip install --upgrade pip
            # Install CPU-only PyTorch first to avoid nvidia CUDA packages
            pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch==2.3.1+cpu
            pip install --no-cache-dir -r requirements.txt
            set -a; . ./.env; set +a
            pkill -f "uvicorn src.api.main:app" || true
            nohup uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --workers 2 > app.log 2>&1 &
            echo "Deployed. Check /health on EC2."


