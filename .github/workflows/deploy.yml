name: Deploy to EC2

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env from Secrets
        run: |
          cat > .env << 'EOF'
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=${{ secrets.DB_NAME }}
          EOF

      - name: Copy source to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: ".env,requirements.txt,src,README.md,.gitignore"
          target: "${{ secrets.EC2_PATH }}"
          strip_components: 0
          overwrite: true
          rm: true

      - name: Install dependencies on EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 10m
          command_timeout: 10m
          script: |
            set -e
            cd ${{ secrets.EC2_PATH }}
            export DEBIAN_FRONTEND=noninteractive
            # 캐시 정리로 디스크 여유 확보
            sudo apt-get clean
            sudo rm -rf /var/lib/apt/lists/* /var/cache/apt/archives/*
            pip cache purge || true
            rm -rf ~/.cache/pip ~/.cache/huggingface || true
            if command -v apt-get >/dev/null 2>&1; then
              sudo apt-get update -y
              sudo apt-get install -y python3 python3-venv python3-pip || true
              sudo apt-get install -y python3.12-venv || true
            elif command -v yum >/dev/null 2>&1; then
              sudo yum install -y python3 python3-pip
            fi
            rm -rf "${{ secrets.EC2_PATH }}/.venv"
            python3 -m venv "${{ secrets.EC2_PATH }}/.venv"
            "${{ secrets.EC2_PATH }}"/.venv/bin/python -m pip install --upgrade pip
            "${{ secrets.EC2_PATH }}"/.venv/bin/pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch==2.3.1+cpu
            "${{ secrets.EC2_PATH }}"/.venv/bin/pip install --no-cache-dir -r requirements.txt
            echo "Dependencies installed."

      - name: Restart app on EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: false
          timeout: 10m
          command_timeout: 10m
          script: |
            trap '' TERM
            set -e
            cd ${{ secrets.EC2_PATH }}
            chmod 600 .env || true
            set -a; . ./.env; set +a
            set +e
            pgrep -f "uvicorn src.api.main:app" >/dev/null 2>&1 && pkill -TERM -f "uvicorn src.api.main:app" || true
            set -e
            # PYTHONPATH 보강 후 절대경로로 기동
            env PYTHONPATH="$PWD:$PWD/src" nohup "${{ secrets.EC2_PATH }}"/.venv/bin/uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --workers 2 > app.log 2>&1 &
            echo "Waiting for health..."
            for i in $(seq 1 30); do
              if curl -sf http://127.0.0.1:8000/health >/dev/null; then
                echo "Health OK"; exit 0; fi
              sleep 1
            done
            echo "Health check failed. Showing last logs:" >&2
            tail -n 200 app.log || true
            exit 1


